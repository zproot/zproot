name: Build - zproot

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build for Android
        run: zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseSafe

      - name: Verify Android binary
        run: file zig-out/bin/zproot zig-out/bin/zproot-loader

      - name: Build for musl
        run: zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSafe

      - name: Verify musl binary
        run: file zig-out/bin/zproot zig-out/bin/zproot-loader

      - name: Upload tracer
        uses: actions/upload-artifact@v7
        with:
          name: zproot-aarch64-linux-android
          path: |
            zig-out/bin/zproot
            zig-out/bin/zproot-loader
